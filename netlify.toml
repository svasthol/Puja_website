# Netlify settings for managuruji.in (static site, published from the repo root)
[build]
  publish = "."

# Long cache for fonts and media; short revalidating cache for pages, CSS and JS
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Keep the generator folder out of search results
[[headers]]
  for = "/_build/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
